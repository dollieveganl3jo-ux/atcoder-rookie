    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Scan QR
          command: |
            mkdir -p /tmp/queue5
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "q-$((i*19))"; done > /tmp/queue5/west-moor-payload; true
            echo "stage ok Xi"
      - persist_to_workspace:
          root: /tmp/queue5
          paths:
            - 'west-moor-payload'
